# Visus — project tool settings: lint (ruff), type checking (pyright/Pylance), tests (pytest).
# One file for all three, pinned on purpose: without it every tool falls back to its own
# defaults, and those move between releases.
# Runtime dependencies are in requirements.txt; dev tools in requirements-dev.txt.

[project]
name = "visus"
version = "0.2.0"
description = "Real-time Israeli license plate recognition: YOLO26m detector + ByteTrack + CNN+CTC plate reader"
license = "MIT"
requires-python = ">=3.12"

# ------------------------------------------------------------------------------ ruff
# The Ruff VS Code extension auto-updates, and its bundled ruff now enables ~37 rule
# families by default (older versions enabled only E4/E7/E9/F). That is what made the
# Problems panel fill up on its own, on two different machines, without anyone touching
# the code. Selecting the rules explicitly here is what makes the result stable.

[tool.ruff]
target-version = "py312"
line-length = 120  # the code is written at ~100-120 columns

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes -- undefined names, unused imports: the rules that catch real bugs
    "W", # pycodestyle warnings
    "I", # import sorting
    "UP", # pyupgrade -- keep syntax current with the target version
]

# Deliberately NOT selected (each was measured against this codebase, not guessed):
#
#   RUF046  "int(round(x)) is already an int" -- true only for a Python float. round() on a
#           numpy scalar returns a numpy scalar, so dropping the int() at those 9 call sites
#           could feed np.float64 into box coordinates, which cv2 requires as int. Following
#           this rule would turn a cosmetic warning into a real bug.
#   DTZ005  "datetime.now() without tz" -- the call sites are deliberate local wall-clock
#           stamps for run-folder names and reports/gate_log.jsonl. Making them tz-aware
#           would change the gate log's recorded format.
#   TRY004  "prefer TypeError" -- these raise RuntimeError for a malformed dataset YAML,
#           which is a configuration error, not a type error.
#   RUF100  "unused noqa" -- ruff does not flag the sys.path.insert() import pattern that
#           the `# noqa: E402` comments guard, so it would report them all as unused. The
#           comments stay: they document why the imports sit below the sys.path line.
#   B905    "zip() without strict=" -- the call sites zip lists that are paired by
#           construction; adding strict= would assert something already guaranteed.

[tool.ruff.lint.isort]
# src/ is flat: modules import each other directly (`from common import ...`), and the
# tools/ scripts and tests reach them by putting src/ on sys.path. Naming them keeps isort
# from filing them as third-party.
known-first-party = ["common", "plate_reader", "plate_origin", "pipeline", "theme", "app", "train_detector",
                     "train_reader"]

# --------------------------------------------------------------------------- pyright
# Read by Pylance in VS Code as well as by the pyright CLI.

[tool.pyright]
include = ["src", "tools", "tests"]
exclude = ["**/__pycache__", ".venv", "data", "runs", "weights"]
# src/ is flat (see isort above), and the tests import tools/ scripts too; this teaches the
# analyzer the same paths pytest uses.
extraPaths = ["src", "tools"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
# keras ships no py.typed marker; read its types from source instead of reporting them missing.
reportMissingTypeStubs = "none"
# ultralytics and matplotlib re-export public names (YOLO, Axes, DEFAULT_CFG) without
# listing them in __all__, so every `from ultralytics import YOLO` was reported as a
# private import. The names are their documented public API.
reportPrivateImportUsage = "none"

# ---------------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: loads the real models or runs a demo video (run with: pytest -m slow)",
]
